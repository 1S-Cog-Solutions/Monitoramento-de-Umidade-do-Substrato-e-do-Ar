<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora Financeira</title>
  </head>

  <body
    style="
      background-color: beige;
      color: black;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      min-height: 100vh;
      margin: 0;
    "
  >
    <div id="div_titulo">
      <h1 style="color: red">
        Sistema de Monitoramento de Champignon Paris 🍄
      </h1>

      <p>
        Controle de umidade para uma produção mais eficiente de
        <b>Champignon Paris</b>
      </p>
    </div>

    <div id="div_controle_umidade">
      <label for="tem_controle"> Já tem umidade automatizada: </label>
      <br />

      <select
        name="controle_umidade"
        id="tem_controle"
        onchange="mostrarInput()"
      >
        <option value="" disabled selected>Selecione uma opção</option>

        <option value="sim">SIM</option>
        <option value="nao">NÃO</option>
      </select>

      <div id="grupo_input" style="display: none; margin-top: 10px">
        <label for="input_prateleira"> Número de prateleiras: </label>

        <input type="text" id="input_prateleira" name="input_prateleira" />

        <br />

        <label for="input_agua"> Gasto mensal com água: </label>

        <input type="text" id="input_agua" name="input_agua" />
        <button onclick="agua()">Calcular gasto ideal</button>
      </div>
    </div>

    <br />

    <div id="div_conteudo" style="color: black">
      <h2>Calculadora Financeira</h2>

      <p>Descubra quanto sua empresa pode <b>economizar!</b></p>

      <input type="text" id="input_producao" />
      <label for="input_producao">
        ⚖️ - Produção mensal de champignon (KG)
      </label>
      <br />

      <input type="text" id="input_preco" />
      <label for="input_preco"> 💵 - Preço de venda por KG (R$) </label>
      <br />

      <input type="text" id="input_perda" />
      <label for="input_perda"> 📉 - Percentual de perda atual (%) </label>
      <br />

      <input type="text" id="input_invest" />
      <label for="input_invest"> 💰 - Investimento no Sistema (R$) </label>
      <br /><br />

      <button onclick="calcular()">CALCULAR RETORNO</button>
    </div>

    <div id="div_exibir"></div>

    <script>
      let reducao = 50;

      function calcular() {
        let producao = Number(input_producao.value);
        let preco = Number(input_preco.value);
        let perda = Number(input_perda.value);
        let investimento = Number(input_invest.value);

        let faturamento = producao * preco;

        let loss = faturamento * (perda / 100);

        let economia = loss * (reducao / 100);

        let ecoAno = economia * 12;

        let retorno = investimento / economia;

        let ecoPercentual = (economia / faturamento) * 100;

        if (producao <= 0 || preco <= 0 || perda < 0 || investimento <= 0) {
          div_exibir.innerHTML = `
            <p style="color: red;">
              <b>Preencha todos os campos com valores válidos.</b>
            </p>
          `;

          return;
        }

        if (economia <= 0) {
          div_exibir.innerHTML = `
            <h2>Resultado da simulação</h2>

            Produção mensal: ${producao} KG <br>
            Faturamento mensal: R$ ${faturamento.toFixed(2)} <br>
            Valor perdido atualmente: R$ ${loss.toFixed(2)} <br>
            Economia estimada por mês:
            <b>R$ 0,00</b>
            <br><br>

            <b>
              Não foi possível calcular o tempo de retorno,
              pois a economia estimada é igual a zero.
            </b>
          `;

          return;
        }

        div_exibir.innerHTML = `
          <h2>
            <b>Resultado da simulação</b>
          </h2>

          Produção mensal:
          ${producao} KG
          <br>

          Faturamento mensal:
          R$ ${faturamento.toFixed(2)}
          <br>

          Valor perdido atualmente:
          R$ ${loss.toFixed(2)}
          <br>

          Economia estimada por mês:
          <b>
            R$ ${economia.toFixed(2)}
          </b>
          <br>

          Economia estimada por ano:
          <b>
            R$ ${ecoAno.toFixed(2)}
          </b>
          <br>

          Redução estimada de desperdício:
          ${ecoPercentual.toFixed(2)}%
          <br>

          Tempo estimado para recuperar o investimento:
          <b>
            ${retorno.toFixed(2)} meses
          </b>

          <br><br>
        `;

        if (retorno <= 12) {
          div_exibir.innerHTML += `
            <b>
              O investimento apresenta um retorno rápido!
            </b>
            <br>

            O sistema pode contribuir para reduzir perdas
            e melhorar o controle da produção.
          `;
        } else {
          div_exibir.innerHTML += `
            <b>
              O retorno do investimento é superior a 12 meses.
            </b>
            <br>

            Avalie os valores de produção e as perdas da
            sua estufa para verificar o potencial de economia.
          `;
        }
      }
      function agua() {
        let shelf = Number(input_prateleira.value);
        let water = Number(input_agua.value);
        let substrato = shelf * 108;
        let gastoIdeal = shelf * 162
      }

      function mostrarInput() {
        let resultSelect = tem_controle.value;

        if (resultSelect === "sim") {
          grupo_input.style.display = "block";
        } else {
          grupo_input.style.display = "none";

          input_prateleira.value = "";
          input_agua.value = "";
        }
      }
    </script>
  </body>
</html>
