<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora Financeira</title>
    <link rel="shortcut icon" type="image/png" href="../assets/icon/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
  </head>

<body style="margin: 0; padding: 40px 16px; font-family: 'Manrope', Arial, sans-serif; background-color: #0b0f12; background-image: linear-gradient(rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0.9)), url('../assets/img/champignon-fundo.jpg'); background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed; color: white">
    <div id="div_topo" style="max-width: 900px; margin: 0 auto 16px auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap">
      <a href="../index.html" style="color: #f0f0f0; text-decoration: none; font-size: 14px; font-weight: 700">&larr; Voltar ao site</a>
      <div style="display: flex; gap: 20px; font-size: 14px; font-weight: 700">
        <a href="../index.html#etapas" style="color: #f0f0f0; text-decoration: none">Como funciona</a>
        <a href="../index.html#contato" style="color: #f0f0f0; text-decoration: none">Contato</a>
        <a href="../login.html" style="color: #e8622c; text-decoration: none">Entrar</a>
      </div>
    </div>

    <div id="div_card" style="max-width: 900px; margin: 0 auto; padding: 40px 32px 32px 32px; box-sizing: border-box; background-color: #0e0e10; border: 1px solid #2a2a2d; border-radius: 20px">

      <div id="div_titulo" style="text-align: center; margin-bottom: 32px">
        <h1 style="color: white; font-family: 'Barlow Condensed', Arial, sans-serif; font-size: 40px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; margin: 0 0 8px 0"> <img src="../assets/icon/favicon.png" alt="Logo" style="display: block; width: 80px; height: auto; margin: 0 auto 14px auto">
          Simulador financeiro
        </h1>

        <p style="margin: 0; font-size: 14px; color: #c4c4c9">
          Quanto o monitoramento pode devolver para o seu
          <b>cultivo de Champignon Paris</b>
        </p>
      </div>

      <div id="div_conteudo" style="color: white">

        <label for="input_camaras" style="display: block; margin-bottom: 8px; font-size: 14px; font-weight: bold">
          Quantas câmaras de cultivo você tem?
        </label>
        <input placeholder="Ex.: 3" type="text" inputmode="decimal" id="input_camaras" style="width: 100%; height: 52px; padding: 0 16px; box-sizing: border-box; margin-bottom: 22px; font-family: inherit; font-size: 16px; color: white; background-color: #1b1c1f; border: 1px solid #2c2d31; border-radius: 8px" />

        <label for="input_producao" style="display: block; margin-bottom: 8px; font-size: 14px; font-weight: bold">
          Produção de cada câmara por ciclo (KG)
        </label>
        <input placeholder="Ex.: 2400" type="text" inputmode="decimal" id="input_producao" style="width: 100%; height: 52px; padding: 0 16px; box-sizing: border-box; margin-bottom: 22px; font-family: inherit; font-size: 16px; color: white; background-color: #1b1c1f; border: 1px solid #2c2d31; border-radius: 8px" />

        <label for="input_ciclos" style="display: block; margin-bottom: 8px; font-size: 14px; font-weight: bold">
          Quantos ciclos de produção por ano?
        </label>
        <input placeholder="Ex.: 4,7" type="text" inputmode="decimal" id="input_ciclos" style="width: 100%; height: 52px; padding: 0 16px; box-sizing: border-box; margin-bottom: 22px; font-family: inherit; font-size: 16px; color: white; background-color: #1b1c1f; border: 1px solid #2c2d31; border-radius: 8px" />

        <label for="input_preco" style="display: block; margin-bottom: 8px; font-size: 14px; font-weight: bold">
          Preço de venda por KG (R$)
        </label>
        <input placeholder="Ex.: 9,90" type="text" inputmode="decimal" id="input_preco" style="width: 100%; height: 52px; padding: 0 16px; box-sizing: border-box; margin-bottom: 22px; font-family: inherit; font-size: 16px; color: white; background-color: #1b1c1f; border: 1px solid #2c2d31; border-radius: 8px" />

        <label for="input_checagem" style="display: block; margin-bottom: 8px; font-size: 14px; font-weight: bold">
          Quanto você gasta por ano com checagem manual? (R$) — opcional
        </label>
        <input placeholder="Ex.: 5475" type="text" inputmode="decimal" id="input_checagem" style="width: 100%; height: 52px; padding: 0 16px; box-sizing: border-box; margin-bottom: 22px; font-family: inherit; font-size: 16px; color: white; background-color: #1b1c1f; border: 1px solid #2c2d31; border-radius: 8px" />

        <button onclick="calcular()" style="width: 100%; height: 52px; font-family: inherit; font-size: 16px; font-weight: bold; color: #1a0f0b; background-color: #ee6340; border: 0; border-radius: 8px; cursor: pointer">SIMULAR</button>

      </div>

      <div id="div_exibir" style="margin-top: 24px"></div>

      <p style="margin: 28px 0 0 0; text-align: center; font-size: 12px; color: #8f8f96">
        *Valores estimados pela Cog Solutions™
      </p>

    </div>

    <script>
      let custoImplantacaoCamara = 784.34; // Preço de implantação de uma câmara com 4 conjuntos de sensores (documento de custos do grupo).
      let mensalidade = 100; // AJUSTE: mensalidade que o grupo definir (R$ por mês).
      let custoPorKg = 1.9; // Custo de colheita, embalagem e frete de cada KG vendido (R$).
      let economiaChecagem = 0.5; // Parte da checagem manual que o sistema evita (50%).
      let cenarios = [2, 5, 10]; // Percentuais da produção que o sistema pode evitar perder.
      let formatoReal = { style: 'currency', currency: 'BRL' }; // Mostra os valores em reais (R$ 1.234,50).
      let formatoKg = { maximumFractionDigits: 0 }; // Mostra os KG sem casas decimais.
      let formatoPercentual = { minimumFractionDigits: 1, maximumFractionDigits: 1 }; // Mostra os percentuais com uma casa.

      function calcular() {
        let camaras = Number(input_camaras.value.replace(',', '.')); // Recebe a quantidade de câmaras.
        let producao = Number(input_producao.value.replace(',', '.')); // Recebe a produção de uma câmara por ciclo, em KG.
        let ciclos = Number(input_ciclos.value.replace(',', '.')); // Recebe a quantidade de ciclos por ano.
        let preco = Number(input_preco.value.replace(',', '.')); // Recebe o preço de venda de cada KG.
        let checagem = Number(input_checagem.value.replace(',', '.')); // Recebe o gasto anual com checagem manual (vazio vale 0).

        if ( // Inicia a validação dos dados informados.
          !(camaras > 0) || // Verifica se a quantidade de câmaras é inválida.
          !(producao > 0) || // Verifica se a produção é inválida.
          !(ciclos > 0) || // Verifica se a quantidade de ciclos é inválida.
          !(preco > custoPorKg) || // Verifica se o preço é inválido ou menor que o custo por KG.
          !(checagem >= 0) // Verifica se o gasto com checagem é inválido.
        ) { // Entra aqui caso algum valor esteja incorreto.

          div_exibir.innerHTML = `
            <p style="color: #ff8f6b;">
              <b>Preencha os campos corretamente.</b>
              O preço de venda precisa ser maior que ${custoPorKg.toLocaleString('pt-BR', formatoReal)} (custo de colheita, embalagem e frete por KG).
            </p>`

        } else { // Entra aqui quando todos os dados são válidos.

          let producaoAno = camaras * producao * ciclos; // Calcula a produção total de um ano em KG.
          let receitaAno = producaoAno * preco; // Calcula a receita anual.
          let margemKg = preco - custoPorKg; // Calcula quanto cada KG salvo realmente vale para o produtor.
          let implantacao = camaras * custoImplantacaoCamara; // Calcula o investimento de implantação.
          let custoRecorrente = mensalidade * 12; // Calcula a mensalidade de um ano.
          let custoPrimeiroAno = implantacao + custoRecorrente; // Calcula o custo total do primeiro ano.
          let kgEquilibrio = custoPrimeiroAno / margemKg; // Calcula quantos KG precisam ser salvos para pagar o sistema.
          let percentualEquilibrio = kgEquilibrio / producaoAno * 100; // Calcula esse valor como % da produção anual.
          let ganhoChecagem = checagem * economiaChecagem; // Calcula quanto o sistema economiza na checagem manual.
          let cartoesCenarios = ''; // Guarda o HTML dos cartões de cenário.

          for (let i = 0; i < cenarios.length; i++) { // Repete uma vez para cada cenário.

            let percentual = cenarios[i]; // Percentual da produção evitado neste cenário.
            let kgSalvos = producaoAno * percentual / 100; // Calcula os KG salvos no ano.
            let ganhoAno = kgSalvos * margemKg + ganhoChecagem; // Calcula o ganho anual (KG salvos + checagem).
            let resultadoPrimeiroAno = ganhoAno - custoPrimeiroAno; // Calcula o resultado do primeiro ano (ganho menos custo).
            let ganhoMes = (ganhoAno - custoRecorrente) / 12; // Calcula o ganho mensal já descontando a mensalidade.
            let textoRetorno = 'não se paga'; // Texto padrão caso o ganho não cubra o custo.

            if (ganhoMes > 0) { // Entra aqui quando o sistema gera ganho.
              let meses = Math.ceil(implantacao / ganhoMes); // Calcula em quantos meses a implantação se paga.
              textoRetorno = meses + (meses == 1 ? ' mês' : ' meses'); // Escolhe singular ou plural.
            }

            let corResultado = resultadoPrimeiroAno >= 0 ? '#6ee7a0' : '#ff8f6b'; // Verde se lucrou, laranja se não.

            cartoesCenarios += `
              <div style="padding: 16px 18px; background-color: #1b1c1f; border: 1px solid #2c2d31; border-radius: 12px">
                <div style="font-size: 13px; color: #a9a9b0">Se evitar ${percentual}% da produção</div>
                <div style="margin-top: 6px; font-size: 22px; font-weight: 800; color: #6ee7a0">${ganhoAno.toLocaleString('pt-BR', formatoReal)} <span style="font-size: 14px; font-weight: 600; color: #a9a9b0">por ano</span></div>
                <div style="margin-top: 4px; font-size: 13px; color: #a9a9b0">${kgSalvos.toLocaleString('pt-BR', formatoKg)} KG salvos</div>
                <div style="margin-top: 10px; font-size: 13px; color: #a9a9b0">Resultado no 1º ano</div>
                <div style="font-size: 18px; font-weight: 800; color: ${corResultado}">${resultadoPrimeiroAno.toLocaleString('pt-BR', formatoReal)}</div>
                <div style="margin-top: 4px; font-size: 13px; color: #a9a9b0">Retorno em: <b style="color: white">${textoRetorno}</b></div>
              </div>`
          }

          div_exibir.innerHTML = `
            <div style="padding: 28px; background-color: #121214; border: 1px solid #2a2a2d; border-radius: 16px">

              <h2 style="margin: 0; font-family: 'Barlow Condensed', Arial, sans-serif; font-size: 24px; font-weight: 600; color: white">
                Quanto o sistema devolve para você
              </h2>
              <div style="width: 48px; height: 3px; margin: 12px 0 0 0; background-color: #ee6340; border-radius: 2px"></div>

              <p style="margin: 24px 0 10px 0; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #ee6340">Ponto de equilíbrio</p>

              <div style="margin-bottom: 12px; padding: 22px 24px; background-color: rgba(110, 231, 160, 0.07); border: 1px solid rgba(110, 231, 160, 0.35); border-radius: 12px">
                <div style="font-size: 13px; color: #c4c4c9">Para o sistema se pagar no primeiro ano, basta evitar a perda de</div>
                <div style="margin-top: 6px; font-family: 'Barlow Condensed', Arial, sans-serif; font-size: 40px; font-weight: 600; color: #6ee7a0">
                  ${kgEquilibrio.toLocaleString('pt-BR', formatoKg)} KG por ano
                </div>
                <div style="margin-top: 6px; font-size: 13px; color: #a9a9b0">
                  Isso é só ${percentualEquilibrio.toLocaleString('pt-BR', formatoPercentual)}% da sua produção anual de ${producaoAno.toLocaleString('pt-BR', formatoKg)} KG.
                </div>
              </div>

              <p style="margin: 24px 0 10px 0; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #ee6340">Quanto você pode ganhar</p>

              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px">${cartoesCenarios}</div>

              <p style="margin: 24px 0 10px 0; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #ee6340">Seu investimento</p>

              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px">
                <div style="padding: 16px 18px; background-color: #1b1c1f; border: 1px solid #2c2d31; border-radius: 12px">
                  <div style="font-size: 13px; color: #a9a9b0">Implantação (${camaras} ${camaras == 1 ? 'câmara' : 'câmaras'})</div>
                  <div style="margin-top: 6px; font-size: 22px; font-weight: 800; color: white">${implantacao.toLocaleString('pt-BR', formatoReal)}</div>
                </div>
                <div style="padding: 16px 18px; background-color: #1b1c1f; border: 1px solid #2c2d31; border-radius: 12px">
                  <div style="font-size: 13px; color: #a9a9b0">Mensalidade</div>
                  <div style="margin-top: 6px; font-size: 22px; font-weight: 800; color: white">${mensalidade.toLocaleString('pt-BR', formatoReal)}</div>
                </div>
                <div style="padding: 16px 18px; background-color: #1b1c1f; border: 1px solid #2c2d31; border-radius: 12px">
                  <div style="font-size: 13px; color: #a9a9b0">Custo total no 1º ano</div>
                  <div style="margin-top: 6px; font-size: 22px; font-weight: 800; color: white">${custoPrimeiroAno.toLocaleString('pt-BR', formatoReal)}</div>
                </div>
              </div>

              <p style="margin: 24px 0 10px 0; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #ee6340">Seu negócio hoje</p>

              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px">
                <div style="padding: 16px 18px; background-color: #1b1c1f; border: 1px solid #2c2d31; border-radius: 12px">
                  <div style="font-size: 13px; color: #a9a9b0">Produção por ano</div>
                  <div style="margin-top: 6px; font-size: 22px; font-weight: 800; color: white">${producaoAno.toLocaleString('pt-BR', formatoKg)} <span style="font-size: 14px; font-weight: 600; color: #a9a9b0">KG</span></div>
                </div>
                <div style="padding: 16px 18px; background-color: #1b1c1f; border: 1px solid #2c2d31; border-radius: 12px">
                  <div style="font-size: 13px; color: #a9a9b0">Receita por ano</div>
                  <div style="margin-top: 6px; font-size: 22px; font-weight: 800; color: white">${receitaAno.toLocaleString('pt-BR', formatoReal)}</div>
                </div>
                <div style="padding: 16px 18px; background-color: #1b1c1f; border: 1px solid #2c2d31; border-radius: 12px">
                  <div style="font-size: 13px; color: #a9a9b0">Cada KG salvo vale</div>
                  <div style="margin-top: 6px; font-size: 22px; font-weight: 800; color: white">${margemKg.toLocaleString('pt-BR', formatoReal)}</div>
                  <div style="margin-top: 4px; font-size: 13px; color: #a9a9b0">preço menos colheita, embalagem e frete</div>
                </div>
              </div>

              <div style="margin-top: 24px; padding: 14px 16px; font-size: 13px; line-height: 1.5; color: #c4c4c9; background-color: rgba(238, 99, 64, 0.08); border: 1px solid rgba(238, 99, 64, 0.35); border-radius: 10px">
                <b style="color: white">Importante:</b>
                esta é uma simulação com as premissas do projeto (implantação de ${custoImplantacaoCamara.toLocaleString('pt-BR', formatoReal)} por câmara, colheita, embalagem e frete de ${custoPorKg.toLocaleString('pt-BR', formatoReal)} por KG) e não inclui o computador de coleta.
                O sistema monitora e envia alertas, mas não garante lucro: o retorno real se mede em um piloto, com os dados da sua operação.
              </div>

            </div>`
        }

      }

    </script>

  <script>
      // dentro do dashboard (iframe): sem barra do topo, sem moldura, ocupando a área toda
      if (location.search.indexOf('embutido') >= 0) {
        document.getElementById('div_topo').style.display = 'none';
        document.body.style.backgroundImage = 'none';
        document.body.style.backgroundColor = '#0b0f12';
        document.body.style.padding = '24px 40px';
        let card = document.getElementById('div_card');
        card.style.maxWidth = '1100px';
        card.style.border = 'none';
        card.style.backgroundColor = 'transparent';
        card.style.padding = '0';
      }
    </script>
</body>
</html>
