<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard de Monitoramento | Cog Solutions</title>
  <link rel="shortcut icon" type="image/png" href="..\public\assets\icon\favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <img src="..\public\assets\icon\favicon.png" alt="Logo da Cog Solutions" class="logo">
    <h1>Dashboard de Monitoramento</h1>
    <p>Temperatura e umidade no cultivo de <b>Champignon Paris</b></p>
  </header>

  <main>
    <section class="card">
      <h2>Variação no Tempo (Gráfico de Linha)</h2>
      <div class="chart-box"><canvas id="graficoLinhas"></canvas></div>
    </section>

    <section class="card">
      <h2>Leitura Atual (Gráfico de Barras)</h2>
      <div class="chart-box"><canvas id="graficoBarras"></canvas></div>
    </section>
  </main>

  <footer>
    <img src="..\public\assets\icon\favicon.png" alt="" class="logo-mini">
    <span>Dados em tempo real · Cog Solutions™</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <script>
    Chart.defaults.color = "#c4c4c9";
    Chart.defaults.borderColor = "#2c2d31";
    Chart.defaults.font.family = "'Nunito', Arial, sans-serif";

    // Cores da marca: laranja e branco sobre preto
    const corTemp = "#ee6340";
    const corUmid = "#ffffff";
    const corSolo = "#8a8a8f";

    const MAX_PONTOS = 10;

    // Histórico das últimas leituras
    const graficoLinhas = new Chart(document.getElementById("graficoLinhas"), {
      type: "line",
      data: {
        labels: [],
        datasets: [
          { label: "Temperatura (°C)",    data: [], borderColor: corTemp, backgroundColor: corTemp, tension: 0.3 },
          { label: "Umidade do ar (%)",   data: [], borderColor: corUmid, backgroundColor: corUmid, tension: 0.3 },
          { label: "Umidade do solo (%)", data: [], borderColor: corSolo, backgroundColor: corSolo, tension: 0.3 }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: { title: { display: true, text: "Horário" } },
          y: { beginAtZero: true, max: 100 }
        }
      }
    });

    // Valor mais recente de cada sensor
    const graficoBarras = new Chart(document.getElementById("graficoBarras"), {
      type: "bar",
      data: {
        labels: ["Temperatura (°C)", "Umidade do ar (%)", "Umidade do solo (%)"],
        datasets: [
          {
            label: "Leitura atual",
            data: [0, 0, 0],
            backgroundColor: [corTemp, corUmid, corSolo],
            borderRadius: 4
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: { beginAtZero: true, max: 100 }
        }
      }
    });

    // Busca o último valor de um endpoint da API
    function ultimoValor(endpoint) {
      return fetch("http://localhost:3300/sensores/" + endpoint)
        .then(response => response.json())
        .then(valores => valores[valores.length - 1]);
    }

    function obterDados() {
      Promise.all([
        ultimoValor("Temperatura"),
        ultimoValor("UmidadeAr"),
        ultimoValor("UmidadeSolo")
      ])
        .then(([temperatura, umidadeAr, umidadeSolo]) => {
          // API ainda sem leituras do Arduino, ou leitura inválida
          if (temperatura == null || umidadeAr == null || umidadeSolo == null) return;

          const horario = new Date().toLocaleTimeString("pt-BR");
          graficoLinhas.data.labels.push(horario);
          graficoLinhas.data.datasets[0].data.push(temperatura);
          graficoLinhas.data.datasets[1].data.push(umidadeAr);
          graficoLinhas.data.datasets[2].data.push(umidadeSolo);

          // Mantém só os últimos pontos
          if (graficoLinhas.data.labels.length > MAX_PONTOS) {
            graficoLinhas.data.labels.shift();
            graficoLinhas.data.datasets.forEach(d => d.data.shift());
          }
          graficoLinhas.update();

          graficoBarras.data.datasets[0].data = [temperatura, umidadeAr, umidadeSolo];
          graficoBarras.update();
        })
        .catch(error => console.error("Erro ao obter dados:", error));
    }

    obterDados();
    // mesmo intervalo do delay(2000) do Arduino
    setInterval(obterDados, 2000);
  </script>
</body>
</html>
