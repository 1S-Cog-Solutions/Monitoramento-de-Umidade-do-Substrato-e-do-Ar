<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <img src="assets/img/cog-solutions-logo.png" alt="">
    <div id="div_formulario">
        <h1>Seja bem vindo de volta!</h1>
        <input type="email" placeholder="E-mail">
        <input type="password" placeholder="Senha">
        <p class="account-text">Não tenho uma conta. <a href="">Crie Aqui</a></p>
        <div class="btn-login-google">
            <img src="assets/img/google-logo.webp" alt="" class="google-logo">
            Continuar com Google
        </div>
        <button id="btn-submit">Entrar</button>
    </div>
</body>
</html>
