<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora Financeira</title>
  </head>

  <body style="background-color: bisque; color: black">

    <div id="div_titulo">
      <h1 style="color: red">
        Sistema de Monitoramento de Champignon Paris 🍄
      </h1>

      <p>
        Controle de umidade para uma produção mais eficiente de
        <b>Champignon Paris</b>
      </p>
    </div>

    <br />

    <div id="div_conteudo" style="color: black">

      <h2>Calculadora Financeira</h2>

      <p>
        Simule a movimentação financeira de uma operação de
        <b>Champignon Paris</b>
      </p>

      <input type="text" id="input_producao" />
      <label for="input_producao">
        ⚖️ - Produção por lote (KG)
      </label>
      <br />

      <input type="text" id="input_preco" />
      <label for="input_preco">
        💵 - Preço de venda por KG (R$)
      </label>
      <br />

      <input type="text" id="input_lotes" />
      <label for="input_lotes">
        📦 - Quantos lotes deseja simular?
      </label>
      <br />

      <input type="text" id="input_meses" />
      <label for="input_meses">
        📅 - Em quantos meses deseja analisar a simulação?
      </label>
      <br />

      <button onclick="calcular()">SIMULAR</button>

    </div>

    <div id="div_exibir"></div>

    <script>

      function calcular() {
        let producao = Number(input_producao.value); // Recebe a produção de um lote em KG.
        let preco = Number(input_preco.value); // Recebe o preço de venda de cada KG.
        let lotes = Number(input_lotes.value); // Recebe a quantidade de lotes da simulação.
        let meses = Number(input_meses.value); // Recebe o período da simulação em meses.

        if ( // Inicia a validação dos dados informados.
          producao <= 0 || // Verifica se a produção é inválida.
          preco <= 0 || // Verifica se o preço é inválido.
          lotes <= 0 || // Verifica se a quantidade de lotes é inválida.
          meses <= 0 // Verifica se o período informado é inválido.
        ) { // Entra aqui caso algum valor esteja incorreto.

          div_exibir.innerHTML = ` 
            <p style="color: red;">
              <b>Preencha todos os campos corretamente.</b>
            </p>`

        } else { // Entra aqui quando todos os dados são válidos.

          let faturamentoLote = producao * preco; // Calcula o faturamento potencial de um lote.

          let producaoTotal = producao * lotes; // Calcula a produção total dos lotes simulados.

          let faturamentoTotal = faturamentoLote * lotes; // Calcula o faturamento total da simulação.

          let producaoMediaMes = producaoTotal / meses; // Calcula a produção média por mês.

          let faturamentoMedioMes = faturamentoTotal / meses; // Calcula o faturamento médio por mês.

          let lotesMediaMes = lotes / meses; // Calcula a quantidade média de lotes por mês.

          div_exibir.innerHTML = `<h2><b>Resultado da Simulação Financeira</b></h2>

            Produção total no período:
            <b>${producaoTotal.toFixed(2)} kg</b><br>

            Faturamento bruto por lote:
            <b>R$ ${faturamentoLote.toFixed(2)}</b><br>

            Faturamento bruto total:
            <b>R$ ${faturamentoTotal.toFixed(2)}</b><br><br>

            Produção média mensal:
            <b>${producaoMediaMes.toFixed(2)} kg</b><br>

            Faturamento médio mensal:
            <b style="color: green;">
              R$ ${faturamentoMedioMes.toFixed(2)}
            </b><br>

            Média de lotes por mês:
            <b>${lotesMediaMes.toFixed(2)} lote(s)</b><br><br>

            Período analisado:
            <b>${meses.toFixed(0)} mês(es)</b><br>

            Quantidade de lotes analisados:
            <b>${lotes.toFixed(0)} lote(s)</b><br><br>

            <b>Importante:</b>
            os resultados representam uma simulação de faturamento
            baseada exclusivamente nos valores informados.`
        }

      } 

    </script>

  </body>
</html>
