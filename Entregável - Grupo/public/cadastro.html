<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="./css/cadastro.css">
    <link rel="icon" type="image/png" href="./assets/icon/favicon.png">

</head>
<body>
    <div id="div_formulario">
        <div class="lado-form">
            <h1>Criar sua conta</h1>
            <p>Preencha os dados abaixo para iniciar sua jornada.</p>
            
            <div class="container">
                <div class="input">
                    <label for="ipt_nome">NOME COMPLETO</label>
                    <input type="text" name="" id="ipt_nome" placeholder="Nome completo">
                </div>
                
                <div class="input">
                    <label for="ipt_email">E-MAIL</label>
                    <input type="email" name="" id="ipt_email" placeholder="E-mail">
                </div>
            </div>
            
            <div class="container">
                <div class="input">
                    <label for="ipt_senha">SENHA</label>
                    <input type="password" placeholder="Senha" name="" id="ipt_senha" oninput="validarSenha(), verificarSenhas()">
                </div>
            
                <div class="input">
                    <label for="ipt_confirmar_senha">CONFIRMAR SENHA</label>
                    <input type="password" name="" id="ipt_confirmar_senha" oninput="verificarSenhas()" placeholder="Confirmar senha">
                </div>
            </div>
            
            <div class="input">
                <label for="ipt_chave">CHAVE DA EMPRESA</label>
                <input type="password" id="ipt_chave" placeholder="Exemplo: mYybaih78snau732">
            </div>

            <div class="regras-senhas" id="regras-senhas">
                <div class="regras" id="regras">
                </div>
                <div class="validar" id="validar">
                </div>
            </div>
            
            <button id="btn-submit">Criar Conta</button>
        </div>
        <div class="lado-logo">
                <img src="./assets/img/cog-solutions-logo.png" alt="" id="logo-login">
        </div>
    </div>

    <script src="./js/validacaoSenha.js"></script>
</body>
</html>
