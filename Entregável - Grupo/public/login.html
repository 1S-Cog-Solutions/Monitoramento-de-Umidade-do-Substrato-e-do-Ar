<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/cadastro.css">
    <link rel="icon" type="image/png" href="./assets/icon/favicon.png">

</head>
<body>
    <div id="div_formulario">
        <div class="lado-logo">
            <img src="./assets/img/cog-solutions-logo.png" alt="" id="logo-login">
        </div>


        <div class="lado-form">
            <div class="form-header">
                <h1>Seja bem vindo de volta!</h1>
                <p>Preencha os dados abaixo para iniciar sua jornada.</p>
            </div>


            <div class="input">
                <label for="ipt_email">E-MAIL</label>
                <input type="email" id="ipt_email" placeholder="E-mail">
            </div>

            <div class="input">
                <label for="ipt_senha">SENHA</label>
                <input type="password" id="ipt_senha" placeholder="Senha">
            </div>

            <p class="account-text">Não tenho uma conta. <a href="cadastroEmpresa.html" target="_blank" class="sign-up-link">Crie Aqui</a></p>
            <button id="btn-submit" onclick="entrar()">Entrar</button>
        </div>

    </div>
</body>
</html>

<script>
    function entrar() {
        var email = ipt_email.value;

        if (email.endsWith('@sptech.school')) {
            window.top.location.href = 'dashboard/dashboard.html';
        } else {
            alert('Acesso permitido apenas para e-mails @sptech.school');
        }
    }
</script>
