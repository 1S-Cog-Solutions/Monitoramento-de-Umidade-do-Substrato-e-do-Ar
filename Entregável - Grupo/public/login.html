<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="./css/cadastro.css">
    <link rel="icon" type="image/png" href="./assets/icon/favicon.png">
    <script src="./js/sessao.js"></script>



</head>
<body>
    <div id="div_formulario">
        <div class="lado-logo">
            <img src="./assets/img/cog-solutions-logo.png" alt="" id="logo-login">
        </div>


        <div class="lado-form">
            <div class="form-header">
                <h1>Seja bem vindo de volta!</h1>
                <p>Preencha os dados abaixo para iniciar sua jornada.</p>
            </div>


            <div class="input">
                <label for="ipt_email">E-MAIL</label>
                <input type="email" id="ipt_email" placeholder="E-mail">
            </div>

            <div class="input">
                <label for="ipt_senha">SENHA</label>
                <input type="password" id="ipt_senha" placeholder="Senha">
            </div>

            <p class="account-text">Não tenho uma conta. <a href="cadastroEmpresa.html" target="_blank" class="sign-up-link">Crie Aqui</a></p>
            <button id="btn-submit" onclick="entrar()">Entrar</button>
        </div>

    </div>

    <div id="div_aguardar" class="loading-div"></div>
  

</body>
</html>

<script>
   
    function entrar() {
        aguardar();

        var emailVar = ipt_email.value;
        var senhaVar = ipt_senha.value;

        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "(Mensagem de erro para todos os campos em branco)";
            finalizarAguardar();
            return false;
        }
        else {
            setInterval(sumirMensagem, 5000)
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;
                    sessionStorage.AQUARIOS = JSON.stringify(json.aquarios)

                    setTimeout(function () {
                        window.location = "./dashboard/dashboard.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }

</script>
