<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Empresa</title>
    <link rel="stylesheet" href="./css/cadastro.css">
    <link rel="icon" type="image/png" href="./assets/icon/favicon.png">
    <script src="./js/sessao.js"></script>
</head>
<body>
    <div id="div_formulario">
        <div class="lado-form">
            <h1>Cadastre sua Empresa</h1>
            <p>Preencha os dados abaixo para iniciar sua jornada.</p>
            
            <div class="container">
                <div class="input">
                    <label for="ipt_empresa">NOME DA EMPRESA</label>
                    <input type="text" name="" id="ipt_empresa" placeholder="Nome da empresa">
                </div>
            
                <div class="input">
                    <label for="ipt_cnpj">CNPJ</label>
                    <input type="text" name="" id="ipt_cnpj" placeholder="CNPJ">
                </div>
            </div>
            <div class="input">
                <label for="ipt_email">E-MAIL</label>
                <input type="email" name="" id="ipt_email" placeholder="E-mail">
            </div>
            <div class="input">
                <label for="ipt_chave">CHAVE DA EMPRESA</label>
                <input type="password" id="ipt_chave" placeholder="Exemplo: mYybaih78snau732">
            </div>
            <div class="regras-senhas" id="regras-senhas">
                <div class="regras" id="regras">
                </div>
                <div class="validar" id="validar">
                </div>
            </div>
            <button id="btn-submit" onclick="cadastrarEmpresa()">Cadastrar Empresa</button>
        </div>
        <div class="lado-logo">
                <img src="./assets/img/cog-solutions-logo.png" alt="" id="logo-login">
        </div>
    </div>

</body>
</html>


<script>

  // Array para armazenar empresas cadastradas para validação de código de ativação 
  let listaEmpresasCadastradas = [];

  function cadastrarEmpresa() {
    // aguardar();

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixos
    var empresaVar = ipt_empresa.value;
    var cnpjVar = ipt_cnpj.value;
    var emailVar = ipt_email.value;
    var codigoVar = ipt_chave.value;
    var idEmpresaVincular

    // Verificando se há algum campo em branco
    if (
      empresaVar == "" ||
      emailVar == "" ||
      cnpjVar == "" ||
      codigoVar == ""
    ) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "(Mensagem de erro para todos os campos em branco)";

      finalizarAguardar();
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }

    // Verificando se o código de ativação é de alguma empresa cadastrada
    for (let i = 0; i < listaEmpresasCadastradas.length; i++) {
      if (listaEmpresasCadastradas[i].codigo_ativacao == codigoVar) {
        idEmpresaVincular = listaEmpresasCadastradas[i].id
        console.log("Código de ativação válido.");
        break;
      } else {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "(Mensagem de erro para código inválido)";
        finalizarAguardar();
      }
    }

    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: empresaVar,
        emailServer: emailVar,
        cnpjServer: cnpjVar,
        idEmpresaVincularServer: idEmpresaVincular
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();
          finalizarAguardar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });

    return false;
  }

  // Listando empresas cadastradas 
  function listar() {
    fetch("/empresas/listar", {
      method: "GET",
    })
      .then(function (resposta) {
        resposta.json().then((empresas) => {
          empresas.forEach((empresa) => {
            listaEmpresasCadastradas.push(empresa);

            console.log("listaEmpresasCadastradas")
            console.log(listaEmpresasCadastradas[0].codigo_ativacao)
          });
        });
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
      });
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>
