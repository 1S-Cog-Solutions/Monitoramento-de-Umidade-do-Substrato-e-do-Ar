<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Empresa</title>
    <link rel="stylesheet" href="./css/cadastro.css">
    <link rel="icon" type="image/png" href="../assets/icon/favicon.png">

</head>
<body>
    <div id="div_formulario">
        <h1>Cadastre sua Empresa</h1>
        <p>Preencha os dados abaixo para iniciar sua jornada.</p>
        

        <div class="container">
            <div class="input">
                <label for="ipt_empresa">NOME DA EMPRESA</label>
                <input type="text" name="" id="ipt_empresa">
            </div>
            
            <div class="input">
                <label for="ipt_cnpj">CNPJ</label>
                <input type="text" name="" id="ipt_cnpj">
            </div>
        </div>

        <div class="input">
            <label for="ipt_email">E-MAIL</label>
            <input type="email" name="" id="ipt_email">
        </div>


        <div class="regras-senhas" id="regras-senhas">
            <div class="regras" id="regras">
            </div>

            <div class="validar" id="validar">
            </div>
        </div>

        <button id="btn-submit">Cadastrar Empresa</button>
    </div>
    <div class="lado-logo">
            <img src="./assets/img/cog-solutions-logo.png" alt="" id="logo-login">
    </div>

</body>
</html>
