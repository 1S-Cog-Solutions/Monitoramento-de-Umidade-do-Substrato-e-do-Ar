<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <main class="card">
        <div class="lado-logo">
            <img src="../assets/img/cog-solutions-logo.png" alt="Logo CogSolutions" id="logo-login">
        </div>

        <div id="div_formulario">
            <div class="form-header">
                <h1>Seja bem-vindo de volta!</h1>
                <p>Preencha os dados abaixo para acessar sua conta.</p>
            </div>

            <div class="input">
                <label for="ipt_email">E-MAIL</label>
                <input type="email" id="ipt_email" placeholder="seuemail@exemplo.com">
            </div>

            <div class="input">
                <label for="ipt_senha">SENHA</label>
                <input type="password" id="ipt_senha" placeholder="Senha">
            </div>

            <div class="input">
                <label for="ipt_chave">CHAVE DA EMPRESA</label>
                <input type="password" id="ipt_chave" placeholder="Chave">
            </div>

            <button id="btn-submit" onclick="entrar()">Entrar</button>

            <div class="links">
                <p class="account-text">Não tenho uma conta. <a href="cadastro.html" class="link">Crie aqui</a></p>
            </div>
        </div>
    </main>

    <script>
        function entrar() {
            var email = ipt_email.value;

            if (email.endsWith('@sptech.school')) {
                window.top.location.href = '../dashboard/dashboard.html';
            } else {
                alert('Acesso permitido apenas para e-mails @sptech.school');
            }
        }
    </script>
</body>
</html>
