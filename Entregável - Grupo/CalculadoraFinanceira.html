<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta tata name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora Financeira</title>
  </head>

  <body
    style="background-color: beige; color: black;">
    <div id="div_titulo">
      <h1 style="color: red">
        Sistema de Monitoramento de Champignon Paris 🍄
      </h1>

      <p>
        Controle de umidade para uma produção mais eficiente de
        <b>Champignon Paris</b>
      </p>
    </div>

    <br />

    <div id="div_conteudo" style="color: black"> <!-- Div contendo: inputs e o botão de calcular retorno-->
      <h2>Calculadora Financeira</h2> 

      <p>Descubra quanto sua empresa pode <b>economizar!</b></p>

      <input type="text" id="input_producao" />
      <label for="input_producao">⚖️ - Produção mensal de champignon (KG)</label><br>

      <input type="text" id="input_preco" />
      <label for="input_preco"> 💵 - Preço de venda por KG (R$) </label><br>

      <input type="text" id="input_perda" />
      <label for="input_perda"> 📉 - Percentual de perda por problemas no controle de umidade (%) </label><br>
      <input type="text" id="input_invest" />
      <label for="input_invest"> 💰 - Investimento no Sistema (R$) </label><br>

      <button onclick="calcular()">CALCULAR RETORNO</button>
    </div>

    <div id="div_exibir"></div>

    <script>
      let reducao = 50;


      function calcular() { // ESSA FUNÇÃO TEM COMO OBJETIVO CALCULAR O FATURAMENTO DO PRODUTOR, PREJUÍZO, E O QUANTO DESSE PREJUÍZO NOSSA SOLUÇÃO É CAPAZ DE MITIGAR
        let producao = Number(input_producao.value);
        let preco = Number(input_preco.value);
        let perda = Number(input_perda.value);
        let investimento = Number(input_invest.value);

        let faturamento = producao * preco;
        let prejuizo = faturamento * (perda / 100);
        let faturamentoComPerdas = faturamento - prejuizo;

        let loss = faturamento * (perda / 100);

        let economia = loss * (reducao / 100);

        let ecoAno = economia * 12;

        let retorno = investimento / economia;

        let ecoPercentual = (economia / faturamento) * 100;

        if (producao <= 0 || preco <= 0 || perda < 0 || investimento <= 0) {
          div_exibir.innerHTML = `
            <p style="color: red;">
              <b>Preencha todos os campos com valores válidos.</b>
            </p>
          `;
        } else {
          if (economia <= 0) {
          div_exibir.innerHTML = `
            <h2>Resultado da simulação</h2>

            Produção mensal: ${producao} KG <br>
            Faturamento mensal: R$ ${faturamentoComPerdas.toFixed(2)} <br>
            Valor perdido atualmente: R$ ${loss.toFixed(2)} <br>
            Economia estimada por mês:
            <b>R$ 0,00</b>
            <br><br>

            <b>
              Não foi possível calcular o tempo de retorno,
              pois a economia estimada é igual a zero.
            </b>
          `;
        }

        div_exibir.innerHTML = `
          <h2>
            <b>Resultado da simulação</b>
          </h2>

          Produção mensal:
          ${producao} KG
          <br>

          Faturamento mensal:
          R$ ${faturamentoComPerdas.toFixed(2)}
          <br>

          Valor perdido atualmente:
          R$ ${loss.toFixed(2)}
          <br>

          Economia estimada por mês:
          <b>
            R$ ${economia.toFixed(2)}
          </b>
          <br>

          Economia estimada por ano:
          <b>
            R$ ${ecoAno.toFixed(2)}
          </b>
          <br>

          Redução estimada de desperdício:
          ${ecoPercentual.toFixed(2)}%
          <br>

          Tempo estimado para recuperar o investimento:
          <b>
            ${retorno.toFixed(2)} meses
          </b>

          <br><br>
        `;

        if (retorno <= 12) {
          div_exibir.innerHTML += `
            <b>
              O investimento apresenta um retorno rápido!
            </b>
            <br>

            O sistema pode contribuir para reduzir perdas
            e melhorar o controle da produção.
          `;
        } else {
          div_exibir.innerHTML += `
            <b>
              O retorno do investimento é superior a 12 meses.
            </b>
            <br>

            Avalie os valores de produção e as perdas da
            sua estufa para verificar o potencial de economia.
          `;
        }
        }

      }
    </script>
