<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulador Financeiro</title>
  </head>

  <body style="background-color: bisque; color: black">
    <h1 style="color: red">
      Sistema de Monitoramento de Champignon Paris 🍄
    </h1>

    <p>
      Simule o impacto financeiro que perdas relacionadas à umidade
      podem representar para uma operação de cultivo.
    </p>

    <h2>Simulador Financeiro</h2>

    <input type="text" id="input_salas" />
    <label for="input_salas">
      🏭 Quantas salas de cultivo estão em operação?
    </label>
    <br>

    <select id="select_produto">
      <option value="#">Selecione uma opcão</option>
      <option value="I">Inteiro</option>
      <option value="F">Fatiado</option>
    </select>
    <label for="select_produto">
      🍄 Produto vendido
    </label>
    <br>

    <input type="text" id="input_anos" />
    <label for="input_anos">
      📅 Quantos anos deseja simular?
    </label>
   <br><br>
    <button onclick="calcular()">SIMULAR</button>
    <div id="div_exibir"></div>
    <script>
      let producaoSala = 500;
      let lotesAno = 4.7;

      function calcular() {
        let salas = Number(input_salas.value);
        let produto = Number(select_produto.value);
        let anos = Number(input_anos.value);

        if (
          salas <= 0 ||
          anos <= 0 ||
          produto < 1 ||
          produto > 2
        ) {
          div_exibir.innerHTML = `
            <p style="color: red;">
              <b>Preencha todos os campos corretamente.</b>
            </p>
          `;
        } else {
          let precoKg = 0;
          let tipoProduto = "";

          if (produto == 1) {
            precoKg = 9.9;
            tipoProduto = "Champignon inteiro";
          } else {
            precoKg = 8.5;
            tipoProduto = "Champignon fatiado";
          }

          let producaoLote = salas * producaoSala;
          let producaoAno = producaoLote * lotesAno;

          let faturamentoLote = producaoLote * precoKg;
          let faturamentoAno = faturamentoLote * lotesAno;

          let perdaLeveKg = producaoLote * 0.15;
          let perdaModeradaKg = producaoLote * 0.225;
          let perdaSeveraKg = producaoLote * 0.3;

          let prejuizoLeveLote = perdaLeveKg * precoKg;
          let prejuizoModeradoLote = perdaModeradaKg * precoKg;
          let prejuizoSeveroLote = perdaSeveraKg * precoKg;

          let prejuizoLeveAno = prejuizoLeveLote * lotesAno;
          let prejuizoModeradoAno = prejuizoModeradoLote * lotesAno;
          let prejuizoSeveroAno = prejuizoSeveroLote * lotesAno;

          let prejuizoLevePeriodo = prejuizoLeveAno * anos;
          let prejuizoModeradoPeriodo = prejuizoModeradoAno * anos;
          let prejuizoSeveroPeriodo = prejuizoSeveroAno * anos;

          div_exibir.innerHTML = `
            <h2>Resultado da Simulação Financeira</h2>

            <h3>Perfil da operação</h3>

            Salas em operação:
            <b>${salas}</b><br>

            Produto comercializado:
            <b>${tipoProduto}</b><br>

            Preço de referência:
            <b>R$ ${precoKg.toFixed(2)} por kg</b><br>

            Período analisado:
            <b>${anos} ano(s)</b><br><br>


            <h3>Produção estimada</h3>

            Produção de referência por sala:
            <b>${producaoSala} kg por lote</b><br>

            Produção estimada por lote:
            <b>${producaoLote.toFixed(2)} kg</b><br>

            Produção estimada por ano:
            <b>${producaoAno.toFixed(2)} kg</b><br><br>


            <h3>Faturamento bruto estimado</h3>

            Por lote:
            <b>R$ ${faturamentoLote.toFixed(2)}</b><br>

            Por ano:
            <b>R$ ${faturamentoAno.toFixed(2)}</b><br>

            Em ${anos} ano(s):
            <b>R$ ${(faturamentoAno * anos).toFixed(2)}</b><br><br>


            <h2>Exposição Financeira às Perdas</h2>


            <h3>🟢 Cenário Leve - 15%</h3>

            Produção comprometida por lote:
            <b>${perdaLeveKg.toFixed(2)} kg</b><br>

            Prejuízo por lote:
            <b>R$ ${prejuizoLeveLote.toFixed(2)}</b><br>

            Prejuízo por ano:
            <b>R$ ${prejuizoLeveAno.toFixed(2)}</b><br>

            Prejuízo acumulado em ${anos} ano(s):
            <b>R$ ${prejuizoLevePeriodo.toFixed(2)}</b><br><br>


            <h3>🟡 Cenário Moderado - 22,5%</h3>

            Produção comprometida por lote:
            <b>${perdaModeradaKg.toFixed(2)} kg</b><br>

            Prejuízo por lote:
            <b>R$ ${prejuizoModeradoLote.toFixed(2)}</b><br>

            Prejuízo por ano:
            <b>R$ ${prejuizoModeradoAno.toFixed(2)}</b><br>

            Prejuízo acumulado em ${anos} ano(s):
            <b>R$ ${prejuizoModeradoPeriodo.toFixed(2)}</b><br><br>


            <h3>🔴 Cenário Severo - 30%</h3>

            Produção comprometida por lote:
            <b>${perdaSeveraKg.toFixed(2)} kg</b><br>

            Prejuízo por lote:
            <b>R$ ${prejuizoSeveroLote.toFixed(2)}</b><br>

            Prejuízo por ano:
            <b>R$ ${prejuizoSeveroAno.toFixed(2)}</b><br>

            Prejuízo acumulado em ${anos} ano(s):
            <b>R$ ${prejuizoSeveroPeriodo.toFixed(2)}</b><br><br>


            <p>
              <b>Importante:</b>
              esta simulação utiliza parâmetros de referência definidos
              na documentação do projeto. Os valores representam cenários
              estimados e não uma garantia de perdas ou de retorno financeiro.
            </p>
          `;
        }
      }
    </script>
  </body>
</html>
