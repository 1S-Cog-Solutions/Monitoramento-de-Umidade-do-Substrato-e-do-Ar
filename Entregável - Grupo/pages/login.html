<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div id="div_formulario">

        <div class="lado-logo">
            <img src="../assets/img/cog-solutions-logo.png" alt="" id="logo-login">
        </div>

        <div class="lado-form">
            <h1>Seja bem vindo de volta!</h1>

            <div class="input-container">
                <input type="email" id="ipt_email" placeholder="E-mail">
                <label for="ipt_email"><img src="../assets/icon/email-icon.png" alt="" class="icon"></label>
            </div>

            <div class="input-container">
                <input type="password" id="ipt_senha" placeholder="Senha">
                <label for="ipt_senha"><img src="../assets/icon/senha-icon.png" alt="" class="icon"></label>
            </div>

            <p class="account-text">Não tenho uma conta. <a href="">Crie Aqui</a></p>
            <div class="btn-login-google">
                <img src="../assets/img/google-logo.webp" alt="" class="google-logo">
                Continuar com Google
            </div>
            <button id="btn-submit">Entrar</button>
        </div>

    </div>
</body>
</html>
