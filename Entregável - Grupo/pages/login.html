<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <div class="lado-logo">
        <img src="../assets/img/cog-solutions-logo.png" alt="" id="logo-login">
    </div>
    <div id="div_formulario">


        <div class="lado-form">
            <div class="form-header">
                <h1>Seja bem vindo de volta!</h1>
                <p>Preencha os dados abaixo para iniciar sua jornada.</p>
            </div>


            <div class="input">
                <label for="ipt_nome">E-MAIL</label>
                <input type="email" id="ipt_email" placeholder="E-mail">
            </div>

            <div class="input">
                <label for="ipt_nome">SENHA</label>
                <input type="password" id="ipt_senha" placeholder="Senha">
            </div>

            <p class="account-text">Não tenho uma conta. <a href="cadastro.html" target="_blank" class="sign-up-link">Crie Aqui</a></p>
            <button id="btn-submit">Entrar</button>
        </div>

    </div>
</body>
</html>
