<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="../css/cadastro.css">
</head>
<body>
    <div id="div_formulario">
        <h1>Criar sua conta</h1>
        <p>Preencha os dados abaixo para iniciar sua jornada.</p>
        
        <div class="input">
            <label for="ipt_nome">NOME COMPLETO</label>
            <input type="text" name="" id="ipt_nome">
        </div>
        
        <div class="input">
            <label for="ipt_email">E-MAIL</label>
            <input type="email" name="" id="ipt_email">
        </div>
        
        <div class="senha">
            <div class="input">
                <label for="ipt_senha">SENHA</label>
                <input type="password" name="" id="ipt_senha">
            </div>
            
            <div class="input">
                <label for="ipt_confirmar_senha">CONFIRMAR SENHA</label>
                <input type="password" name="" id="ipt_confirmar_senha">
            </div>
        </div>
        
        <div class="input">
            <label for="ipt_empresa">NOME DA EMPRESA</label>
            <input type="text" name="" id="ipt_empresa">
        </div>
        
        <div class="input">
            <label for="ipt_cnpj">CNPJ</label>
            <input type="text" name="" id="ipt_cnpj">
        </div>
        
        <div class="input">
            <label for="ipt_tel">TELEFONE</label>
            <input type="tel" name="" id="ipt_tel">
        </div>




    </div>
</body>
</html>
