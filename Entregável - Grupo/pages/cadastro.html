<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="../css/cadastro.css">
</head>
<body>
    <div id="div_formulario">
        <h1>Criar sua conta</h1>
        <p>Preencha os dados abaixo para iniciar sua jornada.</p>
        
        <div class="input">
            <label for="ipt_nome">NOME COMPLETO</label>
            <input type="text" name="" id="ipt_nome">
        </div>
        
        <div class="input">
            <label for="ipt_email">E-MAIL</label>
            <input type="email" name="" id="ipt_email">
        </div>
        
        <div class="container">
            <div class="input">
                <label for="ipt_senha">SENHA</label>
                <input type="password" name="" id="ipt_senha" oninput="validarSenha()">
            </div>
            
            <div class="input">
                <label for="ipt_confirmar_senha">CONFIRMAR SENHA</label>
                <input type="password" name="" id="ipt_confirmar_senha">
            </div>
        </div>

        <div class="regras-senhas" id="regras-senhas">
            <!-- <p>Pelo menos uma letra maiúscula (A-Z).</p>
            <p>Pelo menos uma letra minúscula (a-z).</p>
            <p>Pelo menos um número (0-9).</p>
            <p>Pelo menos um caractere especial.</p> -->
        </div>

        <div class="container">
            <div class="input">
                <label for="ipt_empresa">NOME DA EMPRESA</label>
                <input type="text" name="" id="ipt_empresa">
            </div>
            
            <div class="input">
                <label for="ipt_cnpj">CNPJ</label>
                <input type="text" name="" id="ipt_cnpj">
            </div>
        </div>
        
        <button id="btn-submit">Criar Conta</button>
    </div>
    <div class="lado-logo">
            <img src="../assets/img/cog-solutions-logo.png" alt="" id="logo-login">
    </div>

    <script src="../js/validacaoSenha.js"></script>
</body>
</html>
